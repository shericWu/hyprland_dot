# ~/.tmux.conf for tmux 3.8
# Made with https://tmux.app/config-generator/
# Edit this config: https://tmux.app/config-generator/#pfx=C-a&hist=5000&keys=vi&vsel=1&clip=osc52&split=pipes&nav=vim&resize=1&sstyle=dark&bact=blue&theme=dark&term=xterm-kitty&sbar=modal&lnum=1&tpmauto=0
# Not set here because tmux 3.8 already defaults to: mouse on, escape-time 10
# Apply changes: tmux source-file ~/.tmux.conf  (or Prefix + r)

# ── Prefix key ────────────────────────────────────────────────────────
# Use Ctrl+a as the prefix instead of Ctrl+b
unbind C-b
set -g prefix C-a
# Press Ctrl+a twice to send it to the program inside the pane
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────
# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on
# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 5000
# Show messages for 2 seconds instead of 0.75
set -g display-time 2000
# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on
# Prefix + r reloads this file
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ── Copy mode and clipboard ───────────────────────────────────────────
# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi
# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Let programs inside tmux (Neovim, ssh sessions) set the clipboard with OSC 52,
# and send copies to your terminal's clipboard
set -s set-clipboard on
# Line numbers in copy mode (new in tmux 3.7)
setw -g copy-mode-line-numbers absolute
# Scrollbar on the right of each pane, shown only in copy mode
setw -g pane-scrollbars modal

# ── Panes and windows ─────────────────────────────────────────────────
# Prefix + | splits left/right and Prefix + - splits top/bottom, in the current directory
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"
# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status line ───────────────────────────────────────────────────────
# Redraw the status line every 5 seconds (default 15)
set -g status-interval 5
# Status line colors, with the current window highlighted
set -g status-style "bg=#1e2030,fg=#c0caf5"
setw -g window-status-style "fg=#c0caf5"
setw -g window-status-current-style "bg=#7aa2f7,fg=#1e2030,bold"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""

# ── Pane borders ──────────────────────────────────────────────────────
# Active pane border color (still yellow in copy mode and red when panes are synchronized)
setw -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=#7aa2f7}}"

# ── Colors and terminal ───────────────────────────────────────────────
# Force the dark color theme instead of detecting it from the terminal
set -s theme dark
# 24-bit true color when the outer terminal's TERM is xterm-kitty (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-kitty:RGB"
